name: Native validation
on: [push, pull_request]
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libsqlite3-dev openssl
      - if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements.txt
      - run: python scripts/doctor.py
      - if: runner.os == 'Linux'
        run: python integration/run_checks.py --suite native --suite sanitizers --suite security-sanitizers
        env:
          PYTHON: python
      - if: runner.os == 'macOS'
        run: python integration/run_checks.py --suite native --suite sanitizers --suite tsan --suite security-sanitizers
        env:
          PYTHON: python
      - run: make demo-native PYTHON=python
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ matrix.os }}
          path: |
            build/validation/
            build/native-demo/*/result.json
            build/native-demo/*/flight.json
            build/native-demo/*/*.log
